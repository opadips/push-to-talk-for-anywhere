name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows-latest — fmt, clippy, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend dependencies
        working-directory: ui
        run: npm ci

      # tauri.conf.json points frontendDist at ../ui/dist
      - name: Frontend build
        working-directory: ui
        run: npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

      - name: Check Windows ARM64 target
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --target aarch64-pc-windows-msvc

  linux:
    name: ubuntu-latest (x64) — fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Linux needs the usual Tauri/dev packages before it can build the
      # workspace; the other runners need nothing extra.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libpulse-dev \
            xorg-dev librsvg2-dev build-essential curl wget file libxdo-dev \
            libssl-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend dependencies
        working-directory: ui
        run: npm ci

      # tauri.conf.json points frontendDist at ../ui/dist
      - name: Frontend build
        working-directory: ui
        run: npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

  linux-arm64:
    name: ubuntu-24.04-arm (arm64) — fmt, clippy, test, build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libpulse-dev \
            xorg-dev librsvg2-dev build-essential curl wget file libxdo-dev \
            libssl-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend dependencies
        working-directory: ui
        run: npm ci

      # tauri.conf.json points frontendDist at ../ui/dist
      - name: Frontend build
        working-directory: ui
        run: npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

  macos:
    name: macos-latest (Apple Silicon) — fmt, clippy, test, build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend dependencies
        working-directory: ui
        run: npm ci

      # tauri.conf.json points frontendDist at ../ui/dist
      - name: Frontend build
        working-directory: ui
        run: npm run build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build

      - name: Check macOS Intel target
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --target x86_64-apple-darwin
