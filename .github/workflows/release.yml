name: Release

# Manual release: run it from the Actions tab ("Run workflow") on the default
# branch. It works out the next version, runs the CI gates and builds the app
# on Windows, Linux and macOS, commits the version bump, creates the vX.Y.Z
# tag and publishes a GitHub release with the built files attached.
#
# The version is kept in the workspace Cargo.toml (the app, the CLI and the
# window title all read it from there). With no vX.Y.Z tag yet, the first
# release uses the version already in Cargo.toml; after that the "bump" input
# counts up from the newest tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead of a bump, e.g. 1.2.0 or 1.2.0-beta.1 (optional)"
        type: string
        required: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft, to review before publishing"
        type: boolean
        default: false
      dry_run:
        description: "Build only: no commit, tag or release — the files are kept as a workflow artifact"
        type: boolean
        default: false

# The publish job pushes a commit and a tag and creates the release.
permissions:
  contents: write

# Two releases at once would race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-amd64
            name: Windows x64 (amd64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            test: true
          - id: windows-arm64
            name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
            test: false
          - id: macos-arm64
            name: macOS Apple Silicon (arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            test: true
          - id: macos-intel
            name: macOS Intel (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            arch: intel
            test: true
          - id: linux-amd64
            name: Linux amd64 (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
            test: true
          - id: linux-arm64
            name: Linux arm64 (AArch64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            test: true
          - id: linux-armv7
            name: Linux armv7 (32-bit ARM)
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            arch: armv7
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Only release from the default branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow on '$DEFAULT_BRANCH' (it was started on '$REF_NAME'): the version commit is pushed to the branch it runs on."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags are needed to find the latest version

      # Linux native targets (amd64 and arm64) need the standard Tauri/dev packages.
      - name: Install Linux system packages
        if: matrix.id == 'linux-amd64' || matrix.id == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libpulse-dev \
            xorg-dev librsvg2-dev build-essential curl wget file libxdo-dev \
            libssl-dev

      # Linux armv7 cross-compilation setup on ubuntu-22.04 using multiarch armhf.
      - name: Setup Linux armv7 cross-compilation dependencies
        if: matrix.id == 'linux-armv7'
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i -E 's/^deb ([^[])/deb [arch=amd64,i386] \1/' /etc/apt/sources.list
          sudo sed -i -E 's/^deb ([^[])/deb [arch=amd64] \1/' /etc/apt/sources.list.d/*.list 2>/dev/null || true
          cat << 'EOF' | sudo tee /etc/apt/sources.list.d/armhf.list
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            autoconf automake libtool \
            pkg-config \
            libwebkit2gtk-4.1-dev:armhf \
            libgtk-3-dev:armhf \
            libpulse-dev:armhf \
            libxdo-dev:armhf \
            libssl-dev:armhf \
            librsvg2-dev:armhf

      # Windows ARM64 needs MSVC cross-compilation environment
      - name: Setup MSVC for Windows ARM64
        if: matrix.id == 'windows-arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Work out the version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          version="$(bash scripts/release-version.sh next "$BUMP" "$EXPLICIT")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Set the version in Cargo.toml and Cargo.lock
        shell: bash
        run: |
          bash scripts/release-version.sh apply "${{ steps.version.outputs.version }}"
          # Only the workspace members change; no other dependency moves.
          cargo update --workspace

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend dependencies
        working-directory: ui
        run: npm ci

      # tauri.conf.json points frontendDist at ../ui/dist
      - name: Frontend build
        working-directory: ui
        run: npm run build

      # The same gates as CI: nothing is released that would not pass them.
      - name: Format
        if: matrix.id == 'linux-amd64' || matrix.id == 'windows-amd64' || matrix.id == 'macos-arm64'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.test
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build (release, locked to Cargo.lock)
        env:
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.id == 'linux-armv7' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.id == 'linux-armv7' && '/usr/lib/arm-linux-gnueabihf/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.id == 'linux-armv7' && '/' || '' }}
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: ${{ matrix.id == 'linux-armv7' && 'arm-linux-gnueabihf-gcc' || '' }}
          CC_armv7_unknown_linux_gnueabihf: ${{ matrix.id == 'linux-armv7' && 'arm-linux-gnueabihf-gcc' || '' }}
          CXX_armv7_unknown_linux_gnueabihf: ${{ matrix.id == 'linux-armv7' && 'arm-linux-gnueabihf-g++' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          TARGET_DIR="target/${TARGET}/release"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="target/release"
          fi

          case "$RUNNER_OS" in
            Windows)
              name="push-to-talk-for-anywhere-v${VERSION}-windows-${ARCH}"
              mkdir -p "dist/$name"
              cp "$TARGET_DIR/ptt.exe" README.md "dist/$name/"
              # The cargo binary stays ptt-tool.exe; everything shipped is named push-to-talk-for-anywhere.
              cp "$TARGET_DIR/ptt-tool.exe" "dist/$name/push-to-talk-for-anywhere.exe"
              # The tray app is one self-contained file; offer it on its own too.
              cp "$TARGET_DIR/ptt-tool.exe" "dist/${name}.exe"
              powershell -NoProfile -Command "Compress-Archive -Path 'dist/$name/*' -DestinationPath 'dist/$name.zip'"
              rm -rf "dist/$name"
              if [ "$ARCH" = "amd64" ]; then
                cp "dist/${name}.zip" "dist/push-to-talk-for-anywhere-v${VERSION}-windows-x64.zip"
                cp "dist/${name}.exe" "dist/push-to-talk-for-anywhere-v${VERSION}-windows-x64.exe"
              fi
              ;;
            Linux)
              name="push-to-talk-for-anywhere-v${VERSION}-linux-${ARCH}"
              mkdir -p "dist/$name"
              cp "$TARGET_DIR/ptt" README.md "dist/$name/"
              cp "$TARGET_DIR/ptt-tool" "dist/$name/push-to-talk-for-anywhere"
              tar -czf "dist/$name.tar.gz" -C "dist/$name" .
              rm -rf "dist/$name"
              if [ "$ARCH" = "amd64" ]; then
                cp "dist/$name.tar.gz" "dist/push-to-talk-for-anywhere-v${VERSION}-linux-x64.tar.gz"
              fi
              ;;
            macOS|Darwin)
              name="push-to-talk-for-anywhere-v${VERSION}-macos-${ARCH}"
              mkdir -p "dist/$name"
              cp "$TARGET_DIR/ptt" README.md "dist/$name/"
              cp "$TARGET_DIR/ptt-tool" "dist/$name/push-to-talk-for-anywhere"
              (cd "dist/$name" && zip -q -r "../$name.zip" .)
              rm -rf "dist/$name"
              if [ "$ARCH" = "arm64" ]; then
                cp "dist/$name.zip" "dist/push-to-talk-for-anywhere-v${VERSION}-macos-apple-silicon.zip"
              elif [ "$ARCH" = "intel" ]; then
                cp "dist/$name.zip" "dist/push-to-talk-for-anywhere-v${VERSION}-macos-x64.zip"
              fi
              ;;
            *)
              echo "::error::Unknown runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac
          ls -la dist

      # The publish job collects these and reuses the lock it just built.
      - name: Upload the build files
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist/*
          retention-days: 3

      # One job owns the manifest that gets committed; the Linux amd64 one runs the
      # update that ends up in the repository.
      - name: Upload the manifest for committing
        if: matrix.id == 'linux-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-manifest
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 3

  publish:
    name: publish — commit, tag and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags are needed to find the latest version

      - name: Work out the version again
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          version="$(bash scripts/release-version.sh next "$BUMP" "$EXPLICIT")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Collect the built files
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Check the files belong to this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -la dist
          for f in dist/*; do
            case "$(basename "$f")" in
              "push-to-talk-for-anywhere-v${VERSION}-"*) ;;
              *) echo "::error::unexpected release file '$f'"; exit 1 ;;
            esac
          done

      # One checksum file across every platform's package.
      - name: Build SHA256SUMS.txt
        run: |
          cd dist
          for f in *; do
            [ "$f" = "SHA256SUMS.txt" ] && continue
            sha256sum "$f"
          done | tee SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --- dry run: keep the files, change nothing ----------------------------
      - name: Keep the build (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: push-to-talk-for-anywhere-v${{ steps.version.outputs.version }}-dry-run
          path: dist/*
          retention-days: 7

      # --- publish: only after everything above passed ------------------------
      # The commit goes first and the tag is created by the release itself, so a
      # failure in between leaves no half-made tag: running the workflow again
      # finds the same version, sees Cargo.toml already has it and carries on.
      - name: Restore the manifest to commit
        uses: actions/download-artifact@v4
        with:
          name: cargo-manifest
          path: .

      - name: Commit the version bump
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.toml already says $VERSION: nothing to commit"
          else
            git commit -m "Release v${VERSION}"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Create the tag and the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi

          cat > release-notes.md <<NOTES
          Downloads:

          - **Windows 10/11 (x64 / amd64)** — \`push-to-talk-for-anywhere-v${VERSION}-windows-amd64.zip\` or the bare \`push-to-talk-for-anywhere-v${VERSION}-windows-amd64.exe\` (also available as \`…-windows-x64.*\`)
          - **Windows 11 (ARM64)** — \`push-to-talk-for-anywhere-v${VERSION}-windows-arm64.zip\` or the bare \`push-to-talk-for-anywhere-v${VERSION}-windows-arm64.exe\`
          - **macOS (Apple Silicon)** — \`push-to-talk-for-anywhere-v${VERSION}-macos-arm64.zip\` (grant Accessibility permission on first launch)
          - **macOS (Intel)** — \`push-to-talk-for-anywhere-v${VERSION}-macos-intel.zip\` (also available as \`…-macos-x64.zip\`)
          - **Linux (amd64 / x86_64)** — \`push-to-talk-for-anywhere-v${VERSION}-linux-amd64.tar.gz\` (also available as \`…-linux-x64.tar.gz\`)
          - **Linux (arm64 / AArch64)** — \`push-to-talk-for-anywhere-v${VERSION}-linux-arm64.tar.gz\`
          - **Linux (armv7 / 32-bit ARM)** — \`push-to-talk-for-anywhere-v${VERSION}-linux-armv7.tar.gz\`

          Each archive contains the \`push-to-talk-for-anywhere\` tray app plus the \`ptt\` command-line tool and README. Checksums are in \`SHA256SUMS.txt\`.

          Windows: to use the hotkey while a program that runs as administrator has focus, run push-to-talk-for-anywhere as administrator too.

          ---
          NOTES

          gh release create "$TAG" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "push-to-talk-for-anywhere v${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            "${flags[@]}"

          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
