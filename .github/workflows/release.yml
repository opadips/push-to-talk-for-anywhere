name: Release

# Manual release: run it from the Actions tab ("Run workflow") on the default
# branch. It works out the next version, runs the CI gates and builds the app
# on Windows, Linux and macOS, commits the version bump, creates the vX.Y.Z
# tag and publishes a GitHub release with the built files attached.
#
# The version is kept in the workspace Cargo.toml (the app, the CLI and the
# window title all read it from there). With no vX.Y.Z tag yet, the first
# release uses the version already in Cargo.toml; after that the "bump" input
# counts up from the newest tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead of a bump, e.g. 1.2.0 or 1.2.0-beta.1 (optional)"
        type: string
        required: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft, to review before publishing"
        type: boolean
        default: false
      dry_run:
        description: "Build only: no commit, tag or release — the files are kept as a workflow artifact"
        type: boolean
        default: false

# The publish job pushes a commit and a tag and creates the release.
permissions:
  contents: write

# Two releases at once would race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }} — gates + release build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: windows
          - os: ubuntu-22.04
            id: linux
          - os: macos-latest
            id: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Only release from the default branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow on '$DEFAULT_BRANCH' (it was started on '$REF_NAME'): the version commit is pushed to the branch it runs on."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags are needed to find the latest version

      # Linux needs the usual Tauri/dev packages before it can build the
      # workspace; the other runners need nothing extra.
      - name: Install Linux system packages
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libpulse-dev \
            xorg-dev librsvg2-dev build-essential curl wget file libxdo-dev \
            libssl-dev

      - name: Work out the version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          version="$(bash scripts/release-version.sh next "$BUMP" "$EXPLICIT")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set the version in Cargo.toml and Cargo.lock
        shell: bash
        run: |
          bash scripts/release-version.sh apply "${{ steps.version.outputs.version }}"
          # Only the workspace members change; no other dependency moves.
          cargo update --workspace

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend dependencies
        working-directory: ui
        run: npm ci

      # tauri.conf.json points frontendDist at ../ui/dist
      - name: Frontend build
        working-directory: ui
        run: npm run build

      # The same gates as CI: nothing is released that would not pass them.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release, locked to Cargo.lock)
        run: cargo build --release --locked

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              name="push-to-talk-for-anywhere-v${VERSION}-windows-x64"
              mkdir -p "dist/$name"
              cp target/release/ptt.exe README.md "dist/$name/"
              # The cargo binary stays ptt-tool.exe; everything shipped is named push-to-talk-for-anywhere.
              cp target/release/ptt-tool.exe "dist/$name/push-to-talk-for-anywhere.exe"
              # The tray app is one self-contained file; offer it on its own too.
              cp target/release/ptt-tool.exe "dist/${name}.exe"
              powershell -NoProfile -Command "Compress-Archive -Path 'dist/$name/*' -DestinationPath 'dist/$name.zip'"
              rm -rf "dist/$name"
              ;;
            Linux)
              name="push-to-talk-for-anywhere-v${VERSION}-linux-x64"
              mkdir -p "dist/$name"
              cp target/release/ptt README.md "dist/$name/"
              cp target/release/ptt-tool "dist/$name/push-to-talk-for-anywhere"
              tar -czf "dist/$name.tar.gz" -C "dist/$name" .
              rm -rf "dist/$name"
              ;;
            macOS|Darwin)
              name="push-to-talk-for-anywhere-v${VERSION}-macos-arm64"
              mkdir -p "dist/$name"
              cp target/release/ptt README.md "dist/$name/"
              cp target/release/ptt-tool "dist/$name/push-to-talk-for-anywhere"
              (cd "dist/$name" && zip -q -r "../$name.zip" .)
              rm -rf "dist/$name"
              ;;
            *)
              echo "::error::Unknown runner OS: $RUNNER_OS"
              exit 1
              ;;
          esac
          ls -la dist

      # The publish job collects these and reuses the lock it just built.
      - name: Upload the build files
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: dist/*
          retention-days: 3

      # One job owns the manifest that gets committed; the Linux one runs the
      # update that ends up in the repository.
      - name: Upload the manifest for committing
        if: matrix.id == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-manifest
          path: |
            Cargo.toml
            Cargo.lock
          retention-days: 3

  publish:
    name: publish — commit, tag and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags are needed to find the latest version

      - name: Work out the version again
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          version="$(bash scripts/release-version.sh next "$BUMP" "$EXPLICIT")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Collect the built files
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Check the files belong to this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -la dist
          for f in dist/*; do
            case "$(basename "$f")" in
              "push-to-talk-for-anywhere-v${VERSION}-"*) ;;
              *) echo "::error::unexpected release file '$f'"; exit 1 ;;
            esac
          done

      # One checksum file across every platform's package.
      - name: Build SHA256SUMS.txt
        run: |
          cd dist
          for f in *; do
            [ "$f" = "SHA256SUMS.txt" ] && continue
            sha256sum "$f"
          done | tee SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --- dry run: keep the files, change nothing ----------------------------
      - name: Keep the build (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: push-to-talk-for-anywhere-v${{ steps.version.outputs.version }}-dry-run
          path: dist/*
          retention-days: 7

      # --- publish: only after everything above passed ------------------------
      # The commit goes first and the tag is created by the release itself, so a
      # failure in between leaves no half-made tag: running the workflow again
      # finds the same version, sees Cargo.toml already has it and carries on.
      - name: Restore the manifest to commit
        uses: actions/download-artifact@v4
        with:
          name: cargo-manifest
          path: .

      - name: Commit the version bump
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.toml already says $VERSION: nothing to commit"
          else
            git commit -m "Release v${VERSION}"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Create the tag and the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ] || [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi

          cat > release-notes.md <<NOTES
          Downloads:

          - **Windows 10/11** — \`push-to-talk-for-anywhere-v${VERSION}-windows-x64.zip\` or the bare \`…-windows-x64.exe\` (the tray app on its own)
          - **Linux (X11, amd64)** — \`push-to-talk-for-anywhere-v${VERSION}-linux-x64.tar.gz\` (the tray app and the \`ptt\` tool). Needs an X11 or XWayland session; Wayland is not supported yet.
          - **macOS (Apple Silicon)** — \`push-to-talk-for-anywhere-v${VERSION}-macos-arm64.zip\` (the tray app and the \`ptt\` tool). Grant the Accessibility permission on first launch.

          Each zip/tar.gz contains the \`push-to-talk-for-anywhere\` tray app plus the \`ptt\` command-line tool and the README. Checksums are in \`SHA256SUMS.txt\`.

          Windows: to use the hotkey while a program that runs as administrator has focus, run push-to-talk-for-anywhere as administrator too.

          ---
          NOTES

          gh release create "$TAG" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "push-to-talk-for-anywhere v${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            "${flags[@]}"

          echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
