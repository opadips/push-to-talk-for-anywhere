[workspace]
resolver = "2"
members = ["crates/ptt-core", "crates/ptt-cli", "src-tauri"]

# Version and shared metadata live here (single place); packages inherit them.
# The product name lives in src-tauri/tauri.conf.json (`productName`).
[workspace.package]
version = "1.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
