[package]
name = "ptt-core"
description = "Push-to-talk core logic: no UI, no Tauri, no network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

# Windows-only: the `windows` crate does not build for other targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # low-level input hooks (plan §7)
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # WNDCLASSW carries an HBRUSH (notify window for re-installation, §7)
    "Win32_Graphics_Gdi",
    # session lock/unlock notifications (hook re-install, plan §7)
    "Win32_System_RemoteDesktop",
] }
