[package]
name = "ptt-core"
description = "Push-to-talk core logic: no UI, no Tauri, no network"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# Linux: microphone mute via PulseAudio (works with PipeWire through
# pipewire-pulse), cues via the simple API, input via rdev's evdev grab
# (`unstable_grab` is what makes event *blocking* possible on Linux).
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
rdev = { version = "0.5", features = ["unstable_grab"] }

# macOS: microphone mute through CoreAudio (via the objc2 project's
# generated bindings, which cross-compile without the Apple SDK), cues
# through rodio, input through rdev's CGEventTap.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", features = ["libc"] }
objc2-core-foundation = "0.3"
# AXIsProcessTrusted — is the tap installable before we try it?
objc2-application-services = "0.3"
# "playback" turns on the device-sink side (the mixer + play + Player that
# the cues need); "wav" is the decoder for the embedded 16-bit cues.
rodio = { version = "0.23", default-features = false, features = ["wav", "playback"] }
# `unstable_grab` enables rdev's CGEventTap event *blocking* (used before the
# `listen` fallback on macOS as well, when the tap can be installed).
rdev = { version = "0.5", features = ["unstable_grab"] }

# Windows-only: the `windows` crate does not build for other targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # low-level input hooks (plan §7)
    "Win32_UI_WindowsAndMessaging",
    # raw keyboard input for capture: delivers key presses to our window
    # even while the settings window's WebView2 owns the keyboard focus,
    # which the low-level hook chain does not (bug 3)
    "Win32_UI_Input",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # WNDCLASSW carries an HBRUSH (notify window for re-installation, §7)
    "Win32_Graphics_Gdi",
    # session lock/unlock notifications (hook re-install, plan §7)
    "Win32_System_RemoteDesktop",
    # GetTickCount — the shared tick source for input-stall diagnostics
    "Win32_System_SystemInformation",
    # RegGetValueW — report the LowLevelHooksTimeout Windows applies to our
    # hooks (input-stall diagnostics, spec §4 D5)
    "Win32_System_Registry",
    # GetLastInputInfo — tell a silent hook from an idle machine
    # (input-stall diagnostics, spec §4 D3)
    "Win32_UI_Input_KeyboardAndMouse",
] }
