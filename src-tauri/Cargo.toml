[package]
name = "ptt-tool"
description = "Windows push-to-talk tray app: mic muted by default, unmuted while the bound key is held"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
ptt-core = { path = "../crates/ptt-core" }
ptt-cli = { path = "../crates/ptt-cli" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[features]
# How we build the app: plain `cargo build` (CI and docs/MANUAL_TESTS.md),
# never `tauri build`. Without this feature Tauri compiles with `cfg(dev)`,
# embeds no assets and points the window at `devUrl`
# (http://localhost:1420) — on a machine without the dev server WebView2
# shows "localhost refused to connect". `tauri build` would pass the
# feature itself and `tauri dev` strips it from `default` automatically.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
